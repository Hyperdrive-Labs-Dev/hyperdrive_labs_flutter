name: Quality Control

on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, synchronize, edited, reopened]
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Restrict permissions for security on PRs
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: "stable"
          cache: true
          pub-cache: true

      - name: Install Very Good CLI (for workspace testing)
        run: dart pub global activate very_good_cli

      # Dart Workspaces links all apps and packages in one step
      - name: Fetch Dependencies
        run: flutter pub get

      - name: Build code
        run: dart run build_runner build --workspace

      - name: Lint and Analyze
        run: flutter analyze . --fatal-infos

      - name: Get Changed Packages & Run Dry Run
        run: |
          # 1. Determine base target branch (e.g., origin/develop or origin/main)
          TARGET_BRANCH="origin/${{ github.base_ref || 'develop' }}"

          echo "Comparing changes against $TARGET_BRANCH..."

          # 2. Extract changed package paths inside `packages/`
          CHANGED_PACKAGES=$(git diff --name-only "$TARGET_BRANCH"...HEAD | grep '^packages/' | cut -d/ -f1,2 | sort -u || true)

          if [ -z "$CHANGED_PACKAGES" ]; then
            echo "No packages inside 'packages/' were modified."
            exit 0
          fi

          echo "Found modified packages:"
          echo "$CHANGED_PACKAGES"
          echo "--------------------------------------------------"

          # 3. Loop over changed package directories
          for pkg in $CHANGED_PACKAGES; do
            if [ -f "$pkg/pubspec.yaml" ]; then
              # Check if package is marked private
              if grep -q "publish_to: none" "$pkg/pubspec.yaml"; then
                echo "Skipping $pkg (Private package / publish_to: none)"
              else
                echo "Running 'dart pub publish --dry-run' in $pkg..."
                (cd "$pkg" && grep -v "lib/src/version.dart" .gitignore > .pubignore && dart pub get && dart pub publish --dry-run)
                echo "--------------------------------------------------"
              fi
            fi
          done

      # Runs tests recursively across all /apps and /packages
      - name: Run Workspace Tests
        run: $HOME/.pub-cache/bin/very_good test --recursive
